# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml
#
# `ruff format` is adopted (build #12, 2026-08-17): CI runs `ruff format --check` alongside
# `ruff check`, and `scripts/lint` applies both. This is the only formatter in play — no black.
#
# target-version stays py312, matching hacs.json's HA floor, NOT the devcontainer's Python 3.14
# image. Bumping this to py314 once let ruff format rewrite `except (A, B):` into unparenthesized
# PEP 758 syntax (valid only from Python 3.14) — a hard SyntaxError on the Python versions HA
# 2024.11.0-era installs actually ship. requirements.txt pins a newer homeassistant purely for test
# fixtures; it says nothing about the floor this code must parse under. Do not raise this without
# raising hacs.json's floor and test_packaging.py in lockstep — and note #38 raised that floor to
# 2026.4.0, whose own metadata requires Python >=3.14.2, so py314 would now be safe here too; left
# unbumped only because nothing in this ticket depends on it and it would reformat unrelated code.

target-version = "py312"

lint.select = [
    "B007",    # Loop control variable {name} not used within loop body
    "B014",    # Exception handler with duplicate exception
    "C",       # complexity
    "D",       # docstrings
    "E",       # pycodestyle
    "F",       # pyflakes/autoflake
    "ICN001",  # import concentions; {name} should be imported as {asname}
    "PGH004",  # Use specific rule codes when using noqa
    "PLC0414", # Useless import alias. Import alias does not rename original package.
    "SIM105",  # Use contextlib.suppress({exception}) instead of try-except-pass
    "SIM117",  # Merge with-statements that use the same scope
    "SIM118",  # Use {key} in {dict} instead of {key} in {dict}.keys()
    "SIM201",  # Use {left} != {right} instead of not {left} == {right}
    "SIM212",  # Use {a} if {a} else {b} instead of {b} if not {a} else {a}
    "SIM300",  # Yoda conditions. Use 'age == 42' instead of '42 == age'.
    "SIM401",  # Use get from dict with default instead of an if block
    "T20",     # flake8-print
    "TRY004",  # Prefer TypeError exception for invalid type
    "RUF006",  # Store a reference to the return value of asyncio.create_task
    "UP",      # pyupgrade
    "W",       # pycodestyle
]

lint.ignore = [
    "D202",  # No blank lines allowed after function docstring
    "D203",  # 1 blank line required before class docstring
    "D213",  # Multi-line docstring summary should start at the second line
    "D404",  # First word of the docstring should not be This
    "D406",  # Section name should end with a newline
    "D407",  # Section name underlining
    "D411",  # Missing blank line before section
    "E501",  # line too long
    "E731",  # do not assign a lambda expression, use a def
    "UP046", # Generic type not annotated with a specific type
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
