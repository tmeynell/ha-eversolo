name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron:  "0 0 * * *"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1

        - name: "Run hassfest validation"
          # Tracks master deliberately, not pinned: Home Assistant's own docs require this so
          # hassfest validates against current core. A pinned hassfest goes stale and stops
          # validating anything useful — a slower, worse failure than the supply-chain risk
          # a pin would close.
          uses: "home-assistant/actions/hassfest@master"

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    # HACS installs from public GitHub, so validation is structurally red on a private repo
    # (it reads manifest.json/hacs.json over the public API and gets nothing back). Skip
    # until the repo goes public (build #14) rather than carry a permanently red check;
    # this condition needs no upkeep — it starts running by itself the day visibility flips.
    if: ${{ !github.event.repository.private }}
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1

        - name: "Run HACS validation"
          # Tracks main deliberately, not pinned: HACS's own validation rules move with the
          # action, and a pinned copy silently drifts from what real HACS installs enforce.
          # Same trade as hassfest above — staleness is the worse failure here.
          uses: "hacs/action@main"
          with:
            category: "integration"
            # Remove this 'ignore' key when you have added brand images for your integration to https://github.com/home-assistant/brands
            ignore: "brands"
