name: "Release"

# Fires on a published GitHub release. Writes the release tag verbatim into
# manifest.json's "version", zips custom_components/eversolo/, and attaches the zip
# (named eversolo.zip — hacs.json's "filename" must match) to the release. That's the
# artifact HACS installs as a custom repository.

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1

      - name: "Adjust version number"
        # Writes the tag verbatim — no "v" stripped. The version contract is bare tags
        # (1.0.0, not v1.0.0); a "v" typed into the release tag ships "version": "v1.0.0"
        # inside the zip to every HACS user. Enforce the bare-tag contract when cutting
        # the release, not here.
        shell: "bash"
        run: |
          yq -i -o json '.version="${{ github.event.release.tag_name }}"' \
            "${{ github.workspace }}/custom_components/eversolo/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/eversolo"
          zip eversolo.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: ${{ github.workspace }}/custom_components/eversolo/eversolo.zip
